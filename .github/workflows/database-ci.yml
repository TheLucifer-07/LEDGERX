name: Database CI

on:
  push:
  pull_request:

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create local CI database credentials
        run: |
          password="$(openssl rand -hex 24)"
          dashboard_password="$(openssl rand -hex 24)"
          printf 'POSTGRES_USER=ledgerx_admin\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=ledgerx\nPOSTGRES_HOST_PORT=55432\nPOSTGRES_DASHBOARD_PASSWORD=%s\n' "$password" "$dashboard_password" > .env

      - name: Start clean PostgreSQL 17 service and apply migrations
        run: |
          docker compose down -v
          scripts/setup.sh
          docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U ledgerx_admin -d ledgerx -c "SELECT current_setting('server_version')"

      - name: Run SQL assertions, privileges, and multi-session integration tests
        run: scripts/test.sh

      - name: Stop database containers
        if: always()
        run: docker compose down -v
