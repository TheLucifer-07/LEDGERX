services:
  db:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerx}
      POSTGRES_DASHBOARD_PASSWORD: ${POSTGRES_DASHBOARD_PASSWORD:?Set POSTGRES_DASHBOARD_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ledgerx_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  dashboard-api:
    build:
      context: ./dashboard-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ledgerx}
      SPRING_DATASOURCE_USERNAME: ledgerx_dashboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_DASHBOARD_PASSWORD:?Set POSTGRES_DASHBOARD_PASSWORD in .env}
      DASHBOARD_CORS_ORIGIN: ${DASHBOARD_CORS_ORIGIN:-http://localhost:5174}
    ports:
      - "127.0.0.1:${LEDGERX_API_HOST_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ledgerx_data:
