# Reproducible environment: PostgreSQL 17 + a tools container with psql/make.
#   docker compose up -d --wait db
#   docker compose run --rm tools make test
# NOTE: this file was written in an environment without Docker and has NOT been executed by the author;
# the same scripts were verified against a native PostgreSQL 17.5 server (see docs/TESTING.md).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    volumes: ["ledgerx_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  tools:
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes: [".:/work"]
    profiles: ["tools"]
volumes:
  ledgerx_pg:
